[mypy]
strict = True
ignore_missing_imports = True
explicit_package_bases = True
exclude = (tests/|\.cache/|\.venv/)
# type-arg: JSON-heavy modules use unparameterized dict/list pervasively;
# addressed incrementally — see TYPECHECK_STATUS.md
disable_error_code = type-arg

# Per-module overrides for known dynamic patterns
[mypy-tests.*]
ignore_errors = True

# Complex CLI / command-dispatch modules — annotate public API incrementally
# per TYPECHECK_STATUS.md. no-untyped-def and no-untyped-call suppressed because
# these modules mix typed and untyped helpers; full annotation is tracked in the status doc.
[mypy-scout.match_strategy]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disable_error_code = no-untyped-call

