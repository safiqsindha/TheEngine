[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: end-to-end integration tests (may be slow; skip with -m "not integration")
filterwarnings =
    ignore:.*NotOpenSSLWarning.*:Warning
    ignore::Warning:urllib3
    ignore:A Client was already created.*:UserWarning
    ignore:.*find_common_type.*:DeprecationWarning
